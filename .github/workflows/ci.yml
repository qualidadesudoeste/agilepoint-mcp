name: Verificar MCP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes-locais:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:discovery
      - run: npm audit --omit=dev --audit-level=low
